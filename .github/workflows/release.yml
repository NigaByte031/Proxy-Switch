name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The version the archive is built from. Bump this with manifest.json, or the tag
  # check below fails and the release stops before anything is published.
  EXTENSION_VERSION: '1.9.0'

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the unit tests
        run: npm test

      - name: Check that the tag matches the manifest version
        run: |
          if [ "v$EXTENSION_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the packaged version v$EXTENSION_VERSION"
            exit 1
          fi

      - name: Build the store package
        run: npm run package

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            **Download `proxy-switch-${{ github.ref_name }}.zip`** for Chrome, Edge, Brave and
            Opera (unzip it, then open `chrome://extensions`, turn on **Developer mode** and click
            **Load unpacked**). Requires Chrome 116 or newer; the extension works offline, keeps
            everything on the device and sends nothing anywhere.

            The same archive is what the Chrome Web Store dashboard wants, so it can be uploaded
            as-is.

            ![The popup: the master switch, the server in use, today's traffic and the live speed](https://raw.githubusercontent.com/${{ github.repository }}/main/docs/screenshots/popup.png)

            Everything in this version is written up in
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
