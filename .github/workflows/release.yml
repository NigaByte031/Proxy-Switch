name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the unit tests
        run: npm test

      - name: Check that the tag matches the manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version v$version"
            exit 1
          fi

      - name: Build the store packages
        run: |
          npm run package
          npm run package:firefox

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
          **Download `proxy-switch-${{ github.ref_name }}.zip`** for Chrome, Edge, Brave and Opera,
          or `proxy-switch-${{ github.ref_name }}-firefox.zip` for Firefox (unzip it, then open
          `chrome://extensions`, turn on **Developer mode** and click **Load unpacked**; an
          unsigned Firefox build loads from `about:debugging` instead). Requires Chrome 116 or
          Firefox 140 or newer; the extension works offline, keeps everything on the device and
          sends nothing anywhere.

          Both archives are also what the store dashboards want — Chrome Web Store and
          [addons.mozilla.org](https://addons.mozilla.org) — so either can be uploaded as-is.

            ![The popup: the master switch, the server in use, today's traffic and the live speed](https://raw.githubusercontent.com/${{ github.repository }}/main/docs/screenshots/popup.png)

            Everything in this version is written up in
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
