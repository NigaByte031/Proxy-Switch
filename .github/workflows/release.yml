name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the unit tests
        run: npm test

      - name: Check that the tag matches the manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version v$version"
            exit 1
          fi

      - name: Build the Web Store package
        run: npm run package

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            **Download `proxy-switch-${{ github.ref_name }}.zip`**, unzip it, then open
            `chrome://extensions`, turn on **Developer mode** and click **Load unpacked**. Requires
            Chrome 116 or newer; the extension works offline, keeps everything on the device and
            sends nothing anywhere.

            The same archive is what the Chrome Web Store developer dashboard wants, so it can also
            be uploaded there as-is.

            ![The popup: the master switch, the server in use, today's traffic and the live speed](https://raw.githubusercontent.com/${{ github.repository }}/main/docs/screenshots/popup.png)

            Everything in this version is written up in
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
