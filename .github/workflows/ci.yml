name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check that the generated previews are up to date
        run: npm run preview -- --check

      - name: Run the unit tests
        run: npm test

      - name: Build the store packages
        run: |
          npm run package
          npm run package:firefox

      - name: Upload the extension package
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: proxy-switch-extension
          path: dist/*.zip
          if-no-files-found: error
