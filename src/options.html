<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proxy Switch settings</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/options.css" />
  </head>
  <body class="options">
    <main class="page">
      <header class="page-header">
        <img class="app-logo" src="../icons/icon128.png" alt="" width="40" height="40" />
        <div class="grow">
          <h1 data-i18n="options.title">Proxy Switch settings</h1>
          <p class="muted" data-i18n="app.tagline"></p>
        </div>
        <span class="badge" id="versionBadge"></span>
      </header>

      <section class="card">
        <h2 data-i18n="options.general"></h2>
        <div class="form-grid cols-2">
          <div>
            <label for="langSelect" data-i18n="options.language"></label>
            <select id="langSelect">
              <option value="auto" data-i18n="options.languageAuto"></option>
              <option value="en">English</option>
              <option value="fa">فارسی</option>
            </select>
          </div>
          <div>
            <label for="themeSelect" data-i18n="options.theme"></label>
            <select id="themeSelect">
              <option value="auto" data-i18n="options.themeAuto"></option>
              <option value="light" data-i18n="theme.light"></option>
              <option value="dark" data-i18n="theme.dark"></option>
            </select>
          </div>
        </div>
        <!-- The brand hue, drawn from ACCENTS (options.js) so list and palettes
             cannot drift apart. -->
        <div>
          <label data-i18n="accent.title"></label>
          <div
            id="accentSwatches"
            class="swatches"
            role="radiogroup"
            data-i18n-aria-label="accent.title"
          ></div>
        </div>
        <label class="check">
          <input id="enabledToggle" type="checkbox" />
          <span data-i18n="options.enabled"></span>
        </label>
        <label class="check">
          <input id="authToggle" type="checkbox" />
          <span data-i18n="options.auth"></span>
        </label>
        <p class="muted" data-i18n="options.authHint"></p>
        <!-- Auto-failover: the worker counts proxy errors, confirms them and moves
             on (background.js). -->
        <label class="check">
          <input id="failoverToggle" type="checkbox" />
          <span data-i18n="options.failover"></span>
        </label>
        <p class="muted" data-i18n="options.failoverHint"></p>
        <!-- What the user is told when the worker moves server on its own. -->
        <label class="check">
          <input id="notifyToggle" type="checkbox" />
          <span data-i18n="options.notifyFailover"></span>
        </label>
        <p class="muted" data-i18n="options.notifyFailoverHint"></p>
        <!-- Background checks: on a timer the worker probes one saved server at a
             time, keeping the verdicts recent (server-probe.js). -->
        <label class="check">
          <input id="probeToggle" type="checkbox" />
          <span data-i18n="options.backgroundProbe"></span>
        </label>
        <p class="muted" data-i18n="options.backgroundProbeHint"></p>
      </section>

      <section class="card">
        <h2 data-i18n="options.mode"></h2>
        <div class="chips" id="modeChips">
          <button class="chip" type="button" data-mode="system" data-i18n="mode.system"></button>
          <button class="chip" type="button" data-mode="direct" data-i18n="mode.direct"></button>
          <button class="chip" type="button" data-mode="fixed_servers" data-i18n="mode.manual"></button>
          <button class="chip" type="button" data-mode="pac_script" data-i18n="mode.pac"></button>
        </div>
        <p id="modeHint" class="status-detail"></p>
        <div class="health-row">
          <button id="testBtn" class="ghost-btn" type="button" data-i18n="health.action"></button>
          <p id="testResult" class="health-result hidden" role="status" aria-live="polite"></p>
        </div>

        <!-- Why the toolbar badge says ERR, and a way to ask for another try. -->
        <div id="applyPanel" class="warning apply-panel hidden" role="alert">
          <div class="apply-copy">
            <p id="applyTitle" class="apply-title"></p>
            <p id="applyDetail" class="apply-detail"></p>
          </div>
          <button id="applyRetry" class="ghost-btn danger" type="button" data-i18n="apply.retry"></button>
        </div>

        <div id="pacPanel" class="hidden">
          <!-- Either the URL is downloaded, or the list below builds the script. -->
          <label class="check">
            <input id="pacDomainsToggle" type="checkbox" />
            <span data-i18n="field.domainRouting"></span>
          </label>
          <p class="form-note" data-i18n="field.domainRoutingHint"></p>
          <div id="pacUrlRow">
            <label for="pacUrl" data-i18n="field.pacUrl"></label>
            <input id="pacUrl" type="url" spellcheck="false" data-i18n-placeholder="field.pacPlaceholder" />
            <p class="form-note" data-i18n="field.pacHint"></p>
            <div class="form-actions">
              <button id="pacSave" class="btn" type="button" data-i18n="btn.save"></button>
            </div>
          </div>
          <div id="pacDomainsPanel" class="hidden">
            <label for="pacDomains" data-i18n="field.domainList"></label>
            <textarea
              id="pacDomains"
              rows="6"
              spellcheck="false"
              data-i18n-placeholder="field.domainListPlaceholder"
            ></textarea>
            <p class="form-note" data-i18n="field.domainListHint"></p>
            <div class="form-actions">
              <button id="pacDomainsSave" class="btn" type="button" data-i18n="btn.save"></button>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="traffic.title"></h2>
        <!-- The meter's counters (lib/traffic.js), in their own storage key, never
             in the settings: an import cannot overwrite them. -->
        <div class="traffic-readout">
          <div class="traffic-line">
            <span class="traffic-when" data-i18n="traffic.rightNow"></span>
            <span id="trafficRate" class="traffic-values rate-live">—</span>
          </div>
          <div class="traffic-line">
            <span class="traffic-when" data-i18n="traffic.today"></span>
            <span id="trafficToday" class="traffic-values"></span>
          </div>
          <div class="traffic-line">
            <span class="traffic-when" data-i18n="traffic.total"></span>
            <span id="trafficTotal" class="traffic-values"></span>
          </div>
        </div>
        <p class="form-note" data-i18n="traffic.note"></p>
        <!-- Counted in the worker on requests every page makes; the switch says
             whether it may. -->
        <label class="check">
          <input id="trafficToggle" type="checkbox" />
          <span data-i18n="traffic.enable"></span>
        </label>
        <p class="form-note" data-i18n="traffic.enableHint"></p>
        <div class="form-actions">
          <button id="trafficReset" class="ghost-btn danger" type="button" data-i18n="traffic.reset"></button>
        </div>
        <p id="trafficMessage" class="muted hidden" role="status" aria-live="polite"></p>
      </section>

      <section class="card">
        <div class="section-head">
          <h2 data-i18n="options.servers"></h2>
          <div class="section-actions">
            <button
              id="testAllBtn"
              class="ghost-btn"
              type="button"
              data-i18n="health.testAll.action"
            ></button>
            <button
              id="addBtn"
              class="ghost-btn"
              type="button"
              aria-controls="profileForm"
              aria-expanded="false"
              data-i18n="profiles.add"
            ></button>
          </div>
        </div>
        <p class="muted" data-i18n="options.serversHint"></p>
        <!-- Only revealed once the list is long enough to need it (servers-ui.js). -->
        <div id="profileSearch" class="search hidden">
          <svg class="search-glyph" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="4.6" />
            <path d="M10.5 10.5 14 14" />
          </svg>
          <input
            id="profileQuery"
            type="search"
            autocomplete="off"
            spellcheck="false"
            data-i18n-placeholder="profiles.search"
          />
          <button
            id="profileQueryClear"
            class="icon-btn search-clear hidden"
            type="button"
            data-i18n-title="profiles.searchClear"
            data-i18n-aria-label="profiles.searchClear"
          >
            ✕
          </button>
        </div>
        <ul id="profileList" class="profile-list"></ul>
        <p id="profilesEmpty" class="empty hidden" data-i18n="profiles.empty"></p>
        <p id="profilesNoMatch" class="empty empty-search hidden" role="status"></p>
        <!-- Filled by the "Test all servers" pass: progress, then the counts. -->
        <p id="testAllResult" class="health-result hidden" role="status" aria-live="polite"></p>

        <form id="profileForm" class="form-grid hidden" novalidate>
          <h3 id="formTitle" data-i18n="profiles.new"></h3>
          <div class="form-grid cols-3">
            <div>
              <label for="pfName" data-i18n="field.name"></label>
              <input id="pfName" name="name" type="text" data-i18n-placeholder="field.namePlaceholder" />
            </div>
            <div>
              <label for="pfScheme" data-i18n="field.scheme"></label>
              <select id="pfScheme" name="scheme">
                <option value="http">HTTP</option>
                <option value="https">HTTPS</option>
                <option value="socks4">SOCKS4</option>
                <option value="socks5">SOCKS5</option>
              </select>
            </div>
            <div>
              <label for="pfPort" data-i18n="field.port"></label>
              <input id="pfPort" name="port" type="number" min="1" max="65535" inputmode="numeric" />
            </div>
          </div>
          <div>
            <label for="pfHost" data-i18n="field.host"></label>
            <input id="pfHost" name="host" type="text" spellcheck="false" data-i18n-placeholder="field.hostPlaceholder" />
            <p class="form-note" data-i18n="field.pasteHint"></p>
          </div>
          <div class="form-grid cols-2">
            <div>
              <label for="pfUsername" data-i18n="field.username"></label>
              <input id="pfUsername" name="username" type="text" autocomplete="off" />
            </div>
            <div>
              <label for="pfPassword" data-i18n="field.password"></label>
              <input id="pfPassword" name="password" type="password" autocomplete="off" />
            </div>
          </div>
          <p class="muted" data-i18n="field.authNote"></p>
          <p id="formError" class="error hidden"></p>
          <div class="form-actions">
            <button id="formCancel" class="ghost-btn" type="button" data-i18n="btn.cancel"></button>
            <button class="btn" type="submit" data-i18n="btn.save"></button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2 data-i18n="options.bypass"></h2>
        <p class="muted" data-i18n="options.bypassHint"></p>
        <textarea id="bypassInput" rows="6" data-i18n-placeholder="field.bypassPlaceholder"></textarea>
        <div class="form-actions">
          <button id="bypassSave" class="btn" type="button" data-i18n="btn.save"></button>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="options.data"></h2>
        <p class="muted" data-i18n="options.dataHint"></p>
        <div class="row">
          <button id="exportBtn" class="btn" type="button" data-i18n="btn.export"></button>
          <button id="importBtn" class="ghost-btn" type="button" data-i18n="btn.import"></button>
          <button id="resetBtn" class="ghost-btn danger" type="button" data-i18n="btn.reset"></button>
          <input id="importInput" type="file" accept="application/json,.json" class="hidden" />
        </div>
        <p id="dataMessage" class="muted hidden"></p>
      </section>

      <section class="card">
        <h2 data-i18n="options.about"></h2>
        <p class="muted"><span data-i18n="options.version"></span>: <span id="version"></span></p>
        <p class="muted" data-i18n="options.permissions"></p>
        <p class="muted" data-i18n="options.shortcuts"></p>
        <ul class="permissions">
          <li data-i18n="options.perm.proxy"></li>
          <li data-i18n="options.perm.storage"></li>
          <li data-i18n="options.perm.webRequest"></li>
          <li data-i18n="options.perm.notifications"></li>
          <li data-i18n="options.perm.alarms"></li>
          <li data-i18n="options.perm.host"></li>
        </ul>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
