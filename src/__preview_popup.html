<!doctype html>
<html lang="en">
  <head>
    <script src="./__preview_chrome_stub.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proxy Switch</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body class="popup">
    <header class="app-header">
      <img class="app-logo" src="../icons/icon48.png" alt="" width="28" height="28" />
      <div class="app-titles">
        <h1 data-i18n="app.name">Proxy Switch</h1>
        <p data-i18n="app.tagline"></p>
      </div>
      <button id="langBtn" class="icon-btn" type="button" data-i18n-title="lang.switch" data-i18n-aria-label="lang.switch">فا</button>
      <button id="themeBtn" class="icon-btn" type="button" data-i18n-title="theme.switch" data-i18n-aria-label="theme.switch">◐</button>
      <button id="optionsBtn" class="icon-btn" type="button" data-i18n-title="action.settings" data-i18n-aria-label="action.settings">⚙</button>
    </header>

    <section id="statusCard" class="status-card">
      <div class="status-row">
        <span id="statusDot" class="dot"></span>
        <!-- role=status: a screen reader hears the new mode after a change. -->
        <div class="status-text" role="status">
          <p class="status-head">
            <span id="statePill" class="pill" aria-hidden="true"></span>
            <span id="statusTitle" class="status-title"></span>
          </p>
          <p id="statusDetail" class="status-detail"></p>
        </div>
        <label class="switch">
          <input
            id="masterToggle"
            type="checkbox"
            data-i18n-aria-label="action.masterToggle"
          />
          <span></span>
        </label>
      </div>
      <div class="health-row">
        <button id="testBtn" class="ghost-btn" type="button" data-i18n="health.action">Test connection</button>
        <p id="testResult" class="health-result hidden" role="status" aria-live="polite"></p>
      </div>
      <!-- The meter (lib/traffic.js): what is moving now, and what has gone down
           and up today and in total. Every figure is in the DOM for all four
           templates (lib/traffic-view.js); `data-view` decides which of them are
           shown and where, so a template never needs a second set of numbers. -->
      <div id="trafficPanel" class="traffic-panel" data-view="classic">
        <div id="trafficRow" class="traffic-row">
          <span class="traffic-when" data-i18n="traffic.today"></span>
          <span id="trafficDownMetric" class="traffic-metric">
            <span class="traffic-arrow" aria-hidden="true">↓</span>
            <span id="trafficDown" class="traffic-value">0 B</span>
          </span>
          <span id="trafficUpMetric" class="traffic-metric">
            <span class="traffic-arrow" aria-hidden="true">↑</span>
            <span id="trafficUp" class="traffic-value">0 B</span>
          </span>
        </div>
        <!-- Hidden by the classic template, which keeps the total on hover. -->
        <div id="trafficTotalRow" class="traffic-total-row">
          <span class="traffic-when" data-i18n="traffic.total"></span>
          <span class="traffic-metric">
            <span class="traffic-arrow" aria-hidden="true">↓</span>
            <span id="trafficTotalDown" class="traffic-value">0 B</span>
          </span>
          <span class="traffic-metric">
            <span class="traffic-arrow" aria-hidden="true">↑</span>
            <span id="trafficTotalUp" class="traffic-value">0 B</span>
          </span>
        </div>
        <p id="rateRow" class="rate-row">
          <span class="traffic-when traffic-when-rate" data-i18n="traffic.rightNow"></span>
          <span id="rateDot" class="rate-dot" aria-hidden="true"></span>
          <span id="rateText" class="rate-text"></span>
        </p>
      </div>
      <!-- role=alert: a warning about the proxy not being applied is worth interrupting for. -->
      <p id="warning" class="warning hidden" role="alert"></p>
    </section>

    <section>
      <h2 data-i18n="mode.title"></h2>
      <div class="chips" id="modeChips">
        <button class="chip" type="button" data-mode="system" data-i18n="mode.system"></button>
        <button class="chip" type="button" data-mode="direct" data-i18n="mode.direct"></button>
        <button class="chip" type="button" data-mode="fixed_servers" data-i18n="mode.manual"></button>
        <button class="chip" type="button" data-mode="pac_script" data-i18n="mode.pac"></button>
      </div>
      <p id="modeHint" class="status-detail"></p>
    </section>

    <!-- Sits right under the mode chips, so the PAC URL is never off-screen. -->
    <section id="pacPanel" class="hidden">
      <!-- Either the URL is downloaded, or the list below builds the script. -->
      <label class="check">
        <input id="pacDomainsToggle" type="checkbox" />
        <span data-i18n="field.domainRouting"></span>
      </label>
      <p class="form-note" data-i18n="field.domainRoutingHint"></p>
      <div id="pacUrlRow">
        <label for="pacUrl" data-i18n="field.pacUrl"></label>
        <input id="pacUrl" type="url" spellcheck="false" data-i18n-placeholder="field.pacPlaceholder" />
        <p class="form-note" data-i18n="field.pacHint"></p>
        <div class="form-actions">
          <button id="pacSave" class="btn" type="button" data-i18n="btn.save"></button>
        </div>
      </div>
      <div id="pacDomainsPanel" class="hidden">
        <label for="pacDomains" data-i18n="field.domainList"></label>
        <textarea
          id="pacDomains"
          rows="5"
          spellcheck="false"
          data-i18n-placeholder="field.domainListPlaceholder"
        ></textarea>
        <p class="form-note" data-i18n="field.domainListHint"></p>
        <div class="form-actions">
          <button id="pacDomainsSave" class="btn" type="button" data-i18n="btn.save"></button>
        </div>
      </div>
    </section>

    <section id="manualPanel">
      <div class="section-head">
        <h2 data-i18n="profiles.title"></h2>
        <div class="section-actions">
          <button
            id="testAllBtn"
            class="ghost-btn"
            type="button"
            data-i18n="health.testAll.action"
          ></button>
          <button
            id="addBtn"
            class="ghost-btn"
            type="button"
            aria-controls="profileForm"
            aria-expanded="false"
            data-i18n="profiles.add"
          ></button>
        </div>
      </div>
      <!-- Only revealed once the list is long enough to need it (servers-ui.js). -->
      <div id="profileSearch" class="search hidden">
        <svg class="search-glyph" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.6" />
          <path d="M10.5 10.5 14 14" />
        </svg>
        <input
          id="profileQuery"
          type="search"
          autocomplete="off"
          spellcheck="false"
          data-i18n-placeholder="profiles.search"
        />
        <button
          id="profileQueryClear"
          class="icon-btn search-clear hidden"
          type="button"
          data-i18n-title="profiles.searchClear"
          data-i18n-aria-label="profiles.searchClear"
        >
          ✕
        </button>
      </div>
      <ul id="profileList" class="profile-list"></ul>
      <p id="profilesEmpty" class="empty hidden" data-i18n="profiles.empty"></p>
      <p id="profilesNoMatch" class="empty empty-search hidden" role="status"></p>
      <!-- Filled by the "Test all servers" pass: progress, then the counts. -->
      <p id="testAllResult" class="health-result hidden" role="status" aria-live="polite"></p>

      <form id="profileForm" class="card form-grid hidden" novalidate>
        <h3 id="formTitle" data-i18n="profiles.new"></h3>
        <div class="form-grid cols-3">
          <div>
            <label for="pfName" data-i18n="field.name"></label>
            <input id="pfName" name="name" type="text" data-i18n-placeholder="field.namePlaceholder" />
          </div>
          <div>
            <label for="pfScheme" data-i18n="field.scheme"></label>
            <select id="pfScheme" name="scheme">
              <option value="http">HTTP</option>
              <option value="https">HTTPS</option>
              <option value="socks4">SOCKS4</option>
              <option value="socks5">SOCKS5</option>
            </select>
          </div>
          <div>
            <label for="pfPort" data-i18n="field.port"></label>
            <input id="pfPort" name="port" type="number" min="1" max="65535" inputmode="numeric" />
          </div>
        </div>
        <div>
          <label for="pfHost" data-i18n="field.host"></label>
          <input id="pfHost" name="host" type="text" spellcheck="false" data-i18n-placeholder="field.hostPlaceholder" />
          <p class="form-note" data-i18n="field.pasteHint"></p>
        </div>
        <div class="form-grid cols-2">
          <div>
            <label for="pfUsername" data-i18n="field.username"></label>
            <input id="pfUsername" name="username" type="text" autocomplete="off" />
          </div>
          <div>
            <label for="pfPassword" data-i18n="field.password"></label>
            <input id="pfPassword" name="password" type="password" autocomplete="off" />
          </div>
        </div>
        <p class="form-note" data-i18n="field.authNote"></p>
        <p id="formError" class="error hidden"></p>
        <div class="form-actions">
          <button id="formCancel" class="ghost-btn" type="button" data-i18n="btn.cancel"></button>
          <button class="btn" type="submit" data-i18n="btn.save"></button>
        </div>
      </form>
    </section>

    <footer class="app-footer">
      <div class="footer-row">
        <span id="bypassInfo" class="muted"></span>
        <a href="#" id="editBypass" data-i18n="field.bypass"></a>
      </div>
      <p id="footerMeta" class="footer-meta"></p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
